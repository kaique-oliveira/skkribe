name: Build Electron (Skkribe)

# Cross-platform build of the Skkribe Electron app.
#
# Bundled into the installer (per OS) by this workflow:
#   • whisper.cpp binary (built from source via cmake, Metal-enabled on mac)
#   • Silero VAD model (~864 KB)
#   • diarize.py (committed in resources/python/diarize.py)
#   • python-build-standalone runtime (~30 MB) on every platform
#
# Downloaded at first launch by the packaged app (runtime-setup.js):
#   • ggml-large-v3-q5_0.bin   ~1.08 GB
#   • Python venv + torch CPU + pyannote.audio  ~1.5 GB
#   • pyannote diarization weights              ~100 MB
#
# Triggers:
#   workflow_dispatch, run from the Actions tab.
#   push tags 'skkribe-v*', cuts a Release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'skkribe-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Note: macOS minutes cost 10x on GitHub Actions. macOS can also be
          # built locally on an M-series Mac via `pnpm run build:mac`.
          - os: macos-14        # arm64 dmg/zip
            artifact: skkribe-mac
          - os: windows-latest  # win-x64 NSIS installer
            artifact: skkribe-win
          - os: ubuntu-22.04    # AppImage
            artifact: skkribe-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            src/renderer/pnpm-lock.yaml

      # ── Toolchains for whisper.cpp build ─────────────────────────────────
      - name: Install cmake (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      # macOS-14 runner ships with cmake + clang. windows-latest ships with
      # MSVC + cmake via the "Build Tools" preinstall. No-op on both.

      - name: Install root deps
        run: pnpm install --frozen-lockfile

      - name: Install renderer deps
        working-directory: src/renderer
        run: pnpm install --frozen-lockfile

      - name: Build renderer (Vite)
        working-directory: src/renderer
        run: pnpm run build

      # ── Build whisper.cpp + drop Silero VAD into resources/whisper/ ──────
      - name: Build whisper.cpp (per platform)
        run: pnpm run setup:whisper

      # ── Bundle a portable CPython 3.11 (python-build-standalone) on ALL
      #    platforms, so the diarization venv is built from a known-good
      #    interpreter regardless of the runner's system Python.
      - name: Download portable Python
        run: pnpm run setup:python

      # ── electron-builder packages everything in resources/ via extraResources
      - name: Package (macOS)
        if: matrix.os == 'macos-14'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # don't try to code-sign in CI
        run: pnpm exec electron-builder --mac --publish never

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm exec electron-builder --win --publish never

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: pnpm exec electron-builder --linux --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: ignore
          retention-days: 14

  # ── Publish a GitHub Release with all 3 installers attached ──────────────────
  # Runs only on a `skkribe-v*` tag push (not on manual workflow_dispatch).
  # `needs: build` waits for every matrix job, then this single job collects
  # their artifacts and creates one release — no races, no manual upload.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/skkribe-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # let GITHUB_TOKEN create the release
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts   # → artifacts/skkribe-mac/*, artifacts/skkribe-win/*, …

      - name: Compute version (strip the skkribe- prefix from the tag)
        id: ver
        run: echo "v=${GITHUB_REF_NAME#skkribe-}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Skkribe ${{ steps.ver.outputs.v }}
          files: artifacts/**/*
          fail_on_unmatched_files: false
          body: |
            Transcrição local com identificação de falantes. 100% no seu
            computador, sem nuvem.

            ## Baixar

            - **macOS** (Apple Silicon): `.dmg`
            - **Windows** (x64): `.exe`
            - **Linux** (x64): `.AppImage`

            Na primeira execução o app pede um token gratuito da HuggingFace e
            baixa os modelos (~2,7 GB, uma vez só). Guia completo em
            [docs/GETTING_STARTED.md](https://github.com/kaique-oliveira/skkribe/blob/main/docs/GETTING_STARTED.md).
