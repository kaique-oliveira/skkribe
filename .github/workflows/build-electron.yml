name: Build Electron (Skkribe)

# Cross-platform build of the Skkribe Electron app.
#
# Bundled into the installer (per OS) by this workflow:
#   • whisper.cpp binary (built from source via cmake, Metal-enabled on mac)
#   • Silero VAD model (~864 KB)
#   • diarize.py (committed in resources/python/diarize.py)
#   • python-build-standalone runtime (~30 MB) on every platform
#
# Downloaded at first launch by the packaged app (runtime-setup.js):
#   • ggml-large-v3-q5_0.bin   ~1.08 GB
#   • Python venv + torch CPU + pyannote.audio  ~1.5 GB
#   • pyannote diarization weights              ~100 MB
#
# Triggers:
#   workflow_dispatch, run from the Actions tab.
#   push tags 'skkribe-v*', cuts a Release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'skkribe-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Note: macOS minutes cost 10x on GitHub Actions. macOS can also be
          # built locally on an M-series Mac via `pnpm run build:mac`.
          - os: macos-14        # arm64 dmg/zip
            artifact: skkribe-mac
          - os: windows-latest  # win-x64 NSIS installer
            artifact: skkribe-win
          - os: ubuntu-22.04    # AppImage
            artifact: skkribe-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            src/renderer/pnpm-lock.yaml

      # ── Toolchains for whisper.cpp build ─────────────────────────────────
      - name: Install cmake (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      # macOS-14 runner ships with cmake + clang. windows-latest ships with
      # MSVC + cmake via the "Build Tools" preinstall. No-op on both.

      # ── Vulkan SDK (Windows/Linux only) ──────────────────────────────────
      # Enables the second, GPU-accelerated whisper build (main-vulkan). The
      # app probes it at runtime and falls back to the CPU binary on machines
      # without a Vulkan driver, so shipping it is strictly additive.
      # Both SDK installs are best-effort: setup-whisper.js degrades to a
      # CPU-only package when the Vulkan build can't run, so a broken SDK
      # install must not fail the release.
      - name: Install Vulkan SDK (Linux)
        if: matrix.os == 'ubuntu-22.04'
        continue-on-error: true
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update && sudo apt-get install -y vulkan-sdk

      - name: Install Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: powershell
        run: |
          $ver = "1.3.296.0"
          curl.exe -sSLo vulkan-sdk.exe "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe"
          Start-Process -FilePath .\vulkan-sdk.exe -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$ver"

      - name: Install root deps
        run: pnpm install --frozen-lockfile

      - name: Install renderer deps
        working-directory: src/renderer
        run: pnpm install --frozen-lockfile

      - name: Build renderer (Vite)
        working-directory: src/renderer
        run: pnpm run build

      # ── Build whisper.cpp + drop Silero VAD into resources/whisper/ ──────
      # SKKRIBE_VULKAN=1 additionally builds main-vulkan on win/linux
      # (setup-whisper.js ignores it on macOS, which uses Metal).
      - name: Build whisper.cpp (per platform)
        run: pnpm run setup:whisper
        env:
          SKKRIBE_VULKAN: ${{ matrix.os == 'macos-14' && '0' || '1' }}

      # ── Bundle a portable CPython 3.11 (python-build-standalone) on ALL
      #    platforms, so the diarization venv is built from a known-good
      #    interpreter regardless of the runner's system Python.
      - name: Download portable Python
        run: pnpm run setup:python

      # ── electron-builder packages everything in resources/ via extraResources
      - name: Package (macOS)
        if: matrix.os == 'macos-14'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # don't try to code-sign in CI
        run: pnpm exec electron-builder --mac --publish never

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm exec electron-builder --win --publish never

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: pnpm exec electron-builder --linux --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: ignore
          retention-days: 14

  # ── Publish a GitHub Release with all 3 installers attached ──────────────────
  # Runs only on a `skkribe-v*` tag push (not on manual workflow_dispatch).
  # `needs: build` waits for every matrix job, then this single job collects
  # their artifacts and creates one release — no races, no manual upload.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/skkribe-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # let GITHUB_TOKEN create the release
    steps:
      # The release body is built from CHANGELOG.md, so notes live in the repo
      # (reviewable in the PR that ships the change) instead of being hardcoded
      # in this workflow, where they'd go stale after the first release.
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts   # → artifacts/skkribe-mac/*, artifacts/skkribe-win/*, …

      - name: Compute version (strip the skkribe- prefix from the tag)
        id: ver
        run: echo "v=${GITHUB_REF_NAME#skkribe-}" >> "$GITHUB_OUTPUT"

      - name: Build release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.v }}"          # e.g. v1.1.0
          VERSION="${VERSION#v}"                        # → 1.1.0

          # Extract the "## [1.1.0]" section, stopping at the next "## [" header,
          # then trim the trailing `---` separator and blank lines that belong to
          # the changelog's own layout rather than to the release notes.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/        { exit }
            found                    { print }
          ' CHANGELOG.md \
            | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}' \
            | sed -e '$ { /^---$/d; }' \
            | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}' \
            > notes-body.md

          {
            echo "## Baixar"
            echo
            echo "- **macOS** (Apple Silicon): \`.dmg\`"
            echo "- **Windows** (x64): \`.exe\`"
            echo "- **Linux** (x64): \`.AppImage\`"
            echo
            echo "Na primeira execução o app pede um token gratuito da HuggingFace e"
            echo "baixa os modelos (~2,7 GB, uma vez só). Guia completo em"
            echo "[docs/GETTING_STARTED.md](https://github.com/kaique-oliveira/skkribe/blob/main/docs/GETTING_STARTED.md)."
            echo
          } > RELEASE_NOTES.md

          # A missing/empty section is a mistake worth failing on: shipping a
          # release with no notes is worse than a red build.
          if [ ! -s notes-body.md ]; then
            echo "::error::CHANGELOG.md não tem uma seção '## [$VERSION]'."
            exit 1
          fi
          echo "---" >> RELEASE_NOTES.md
          cat notes-body.md >> RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Skkribe ${{ steps.ver.outputs.v }}
          files: artifacts/**/*
          fail_on_unmatched_files: false
          body_path: RELEASE_NOTES.md
