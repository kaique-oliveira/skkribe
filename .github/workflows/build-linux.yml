name: Build Linux AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - 'linux-v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install AppImage runtime deps (FUSE etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 desktop-file-utils

      - name: Build AppImage
        working-directory: linux
        run: |
          chmod +x packaging/build-appimage.sh
          packaging/build-appimage.sh

      - name: Show AppImage info
        working-directory: linux
        run: |
          ls -lh Skribe-x86_64.AppImage
          file Skribe-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skribe-Linux-AppImage
          path: linux/Skribe-x86_64.AppImage
          retention-days: 14
