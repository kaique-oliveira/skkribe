name: Build Windows exe

on:
  workflow_dispatch:        # manual trigger from the Actions tab
  push:
    tags:
      - 'win-v*'            # also auto-build on tags like `win-v1.0`

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Skribe.sln

      - name: Publish (single-file self-contained x64)
        run: >
          dotnet publish Skribe/Skribe.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:WindowsAppSDKSelfContained=true

      - name: Zip publish folder
        shell: pwsh
        run: |
          $src = "Skribe/bin/Release/net8.0-windows10.0.19041.0/win-x64/publish"
          Compress-Archive -Path "$src/*" -DestinationPath "../Skribe-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skribe-Windows
          path: Skribe-Windows.zip
          retention-days: 14
