name: Skribe
options:
  bundleIdPrefix: com.kah
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40.0"

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: "0.9.0"

targets:
  Skribe:
    type: application
    platform: macOS
    sources:
      - path: Skribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kah.skribe
        PRODUCT_NAME: Skribe
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: Skribe/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Skribe/Resources/Skribe.entitlements
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: false
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: ArgmaxOSS
        product: SpeakerKit
    entitlements:
      path: Skribe/Resources/Skribe.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-only: true
