<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Skribe app icon.

    Visual: a white macOS-style squircle with a centered recording red dot,
    haloed by a soft red glow and accented by three thin transcript lines below.
    Mirrors the "record dot + light surface" brand from the in-app UI.
  -->
  <defs>
    <!-- Soft glow ring around the record dot. -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#DC2626" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#DC2626" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle drop-shadow under the dot. -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="14" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft inner shadow on the squircle for a subtle paper feel. -->
    <linearGradient id="cardShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F7"/>
    </linearGradient>
  </defs>

  <!-- macOS-style rounded square ("squircle" approximation via large corner radius). -->
  <rect x="64" y="64" width="896" height="896" rx="220" ry="220"
        fill="url(#cardShade)"
        stroke="rgba(0,0,0,0.05)" stroke-width="1"/>

  <!-- Soft red halo behind the dot. -->
  <circle cx="512" cy="470" r="320" fill="url(#glow)"/>

  <!-- The record dot itself. -->
  <circle cx="512" cy="470" r="186" fill="#DC2626" filter="url(#dropShadow)"/>

  <!-- Three transcript lines below the dot — the "writing" hint. -->
  <g fill="#2A2A2C">
    <rect x="296" y="752" width="432" height="22" rx="11" opacity="0.85"/>
    <rect x="296" y="794" width="380" height="22" rx="11" opacity="0.55"/>
    <rect x="296" y="836" width="280" height="22" rx="11" opacity="0.30"/>
  </g>
</svg>
